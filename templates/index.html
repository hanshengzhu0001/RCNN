<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Voiceover Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Image Voiceover Platform</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Left Column: Image and Recording -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="mb-4">
                    <img id="currentImage" src="" alt="Current Image" class="w-full h-auto rounded-lg">
                </div>
                
                <div class="flex flex-col items-center space-y-4">
                    <button id="recordButton" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                        Start Recording
                    </button>
                    <div id="recordingTimer" class="text-xl font-semibold hidden">00:00</div>
                </div>
            </div>

            <!-- Right Column: Transcription -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Transcription</h2>
                <div id="transcription" class="mb-4 p-4 bg-gray-50 rounded-lg min-h-[200px]"></div>
                
                <h2 class="text-xl font-semibold mb-4">Refined Transcription</h2>
                <textarea id="refinedTranscription" class="w-full p-4 bg-gray-50 rounded-lg min-h-[200px] border border-gray-300"></textarea>
                
                <button id="saveRefined" class="mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                    Save Refined Transcription
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
