<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Voiceover Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .image-container {
            position: relative;
            margin-bottom: 15px;
        }
        #currentImage {
            max-width: 100%;
            height: auto;
        }
        .segmentation-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .region {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: filter 0.3s ease;
        }
        .region:hover {
            filter: brightness(1.2);
        }
        .region.dimmed {
            filter: brightness(0.7);
        }
        .controls {
            margin: 15px 0;
        }
        .recording {
            color: red;
        }
        #transcription {
            white-space: pre-wrap;
        }
        .segment {
            margin: 8px 0;
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .marker {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }
        .marker-label {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 11px;
            transform: translateY(-100%);
            margin-top: -3px;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container">
        <h1 class="text-3xl font-bold text-center">Image Voiceover Platform</h1>
        
        <div class="compact-layout">
            <!-- Left Panel: Image and Controls -->
            <div class="left-panel">
                <div class="image-container">
                    <img id="currentImage" src="" alt="Current Image" class="w-full h-auto rounded-lg">
                    <div id="segmentationOverlay" class="segmentation-overlay"></div>
                </div>
                <div id="markersContainer"></div>
                
                <!-- Area to display info of clicked scientific analysis box -->
                <div id="clickedBoxInfo" class="bg-gray-50 rounded-lg text-gray-700">
                    Click on a bounding box on the image to see details here.
                </div>
                
                <div class="controls-section">
                    <div class="flex justify-center space-x-2">
                        <button id="recordButton" class="bg-blue-500 hover:bg-blue-600 text-white font-bold rounded">
                            Start Recording
                        </button>
                        <button id="markObjectsButton" class="bg-green-500 hover:bg-green-600 text-white font-bold rounded">
                            Mark Objects
                        </button>
                        <button id="analyzeScientificButton" class="bg-purple-500 hover:bg-purple-600 text-white font-bold rounded">
                            Analyze Scientific
                        </button>
                    </div>
                    <div id="recordingTimer" class="text-lg font-semibold text-center hidden">00:00</div>
                    
                    <!-- Object List -->
                    <div class="mt-3">
                        <h3 class="text-base font-semibold mb-2">Marked Objects</h3>
                        <div id="objectList" class="object-list bg-gray-50 p-3 rounded-lg">
                            <!-- Objects will be listed here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Transcription -->
            <div class="right-panel">
                <div class="transcription-section">
                    <h2 class="text-lg font-semibold">Transcription</h2>
                    <div id="transcription" class="bg-gray-50 rounded-lg"></div>
                </div>
                
                <div class="transcription-section">
                    <h2 class="text-lg font-semibold">Refined Transcription</h2>
                    <textarea id="refinedTranscription" class="w-full bg-gray-50 rounded-lg border border-gray-300 resize-none"></textarea>
                </div>
                
                <button id="saveRefined" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-3 rounded text-sm">
                    Save Refined Transcription
                </button>
            </div>
        </div>
    </div>

    <!-- Object Marking Dialog -->
    <div id="objectDialog" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-5 rounded-lg shadow-xl">
            <h3 class="text-lg font-semibold mb-3">Mark Object</h3>
            <input type="text" id="objectName" placeholder="Enter object name/tag" 
                   class="w-full p-2 border border-gray-300 rounded mb-3">
            <div class="flex justify-end space-x-2">
                <button id="cancelMarkObject" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-3 rounded text-sm">
                    Cancel
                </button>
                <button id="saveMarkObject" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-3 rounded text-sm">
                    Save
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
