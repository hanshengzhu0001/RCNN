<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Voiceover Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .image-container {
            position: relative;
            margin-bottom: 20px;
        }
        #currentImage {
            max-width: 100%;
            height: auto;
        }
        .segmentation-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .region {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: filter 0.3s ease;
        }
        .region:hover {
            filter: brightness(1.2);
        }
        .region.dimmed {
            filter: brightness(0.7);
        }
        .controls {
            margin: 20px 0;
        }
        .recording {
            color: red;
        }
        #transcription {
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .segment {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Image Voiceover Platform</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Left Column: Image and Recording -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="mb-4">
                    <div class="image-container">
                        <img id="currentImage" src="" alt="Current Image" class="w-full h-auto rounded-lg">
                        <div id="segmentationOverlay" class="segmentation-overlay"></div>
                    </div>
                </div>
                
                <div class="flex flex-col items-center space-y-4">
                    <button id="recordButton" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                        Start Recording
                    </button>
                    <div id="recordingTimer" class="text-xl font-semibold hidden">00:00</div>
                </div>
            </div>

            <!-- Right Column: Transcription -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Transcription</h2>
                <div id="transcription" class="mb-4 p-4 bg-gray-50 rounded-lg min-h-[200px]"></div>
                
                <h2 class="text-xl font-semibold mb-4">Refined Transcription</h2>
                <textarea id="refinedTranscription" class="w-full p-4 bg-gray-50 rounded-lg min-h-[200px] border border-gray-300"></textarea>
                
                <button id="saveRefined" class="mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                    Save Refined Transcription
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
